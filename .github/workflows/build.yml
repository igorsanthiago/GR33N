name: Build GR33N PS3 PKG

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps3dev/ps3dev:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools if missing
        run: |
          apt-get update && apt-get install -y git make curl

      - name: Build dependencies
        run: |
          chmod +x deps/*.sh
          cd deps
          ./build-mbedtls.sh
          ./build-libsrtp.sh
          ./build-usrsctp.sh
          ./build-libpeer.sh
          ./build-opus.sh
          cd ..

      - name: Compile PKG
        run: |
          make pkg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gr33n-wifi-fix-pkg
          path: |
            gr33n.pkg
            gr33n.self
